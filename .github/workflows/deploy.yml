name: Build, Push and Deploy to Kubernetes

on:
  push:
    branches:
      - main

# Permissões necessárias para publicar pacotes no GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # --- ETAPA 1: BUILD & PUSH DA IMAGEM DOCKER ---
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Configuração para compilar imagens multi-arquitetura (necessário para rodar na VM ARM da OCI)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Define a tag da imagem baseada no nome do repositório (minúsculo) e tag "latest" + hash do git commit
      - name: Build and Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          platforms: linux/arm64  # Configura especificamente para a arquitetura A1 Flex da OCI
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quiteria-bot:latest
            ghcr.io/${{ github.repository_owner }}/quiteria-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- ETAPA 2: IMPLANTAÇÃO NO KUBERNETES (CD) ---
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dos manifestos do Kubernetes
        uses: actions/checkout@v4

      # Usamos SCP para enviar os arquivos de manifesto antes do script rodar
      - name: Transferir Manifestos Kubernetes para o Servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "k8s/"
          target: "/tmp/k8s-deploy/"

      - name: Aplicar Manifestos na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Define o caminho de configuração do kubectl para a sessão SSH
            export KUBECONFIG=~/.kube/config
            
            # Aplicar manifesto atualizado
            kubectl apply -f /tmp/k8s-deploy/k8s/
            
            # Forçar o Kubernetes a baixar a nova imagem ":latest" reiniciando o Deployment
            kubectl rollout restart deployment/quiteria-bot
            
            # Aguardar o rollout finalizar com sucesso
            kubectl rollout status deployment/quiteria-bot --timeout=90s
            
            # Limpar arquivos temporários
            rm -rf /tmp/k8s-deploy
            echo "=== Deploy Kubernetes finalizado com sucesso! ==="
